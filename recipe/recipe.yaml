context:
  build_number: 2
  name: ocaml-cppo
  version: "1.8.0"

  # Set to true when ocamlbuild >= 0.16.1 build 1 is available on conda-forge
  # NOTE: flipping this to true makes the package ship cppo_ocamlbuild, which is a
  # real OCaml library (ocamlbuild_plugin/dune declares `library`) and therefore
  # ships compiled interfaces. At that point this package MUST also pin ocaml on
  # run: to the same version it was built against, or end users hit
  # "inconsistent assumptions over implementation" errors. While this is false the
  # package is executable-only and needs no runtime ocaml constraint.
  build_cppo_ocamlbuild: false

  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}
  sh: ${{ "sh" if unix else "bat" }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/ocaml-community/cppo/archive/v${{ version }}.tar.gz
    sha256: 6e62a8ee0217c9cc38d5860110eb18eb8d89c05c420353d298e1431fe8bac00f

build:
  number: ${{ build_number }}
  script:
    env:
      BUILD_CPPO_OCAMLBUILD: ${{ "1" if build_cppo_ocamlbuild else "0" }}

requirements:
  build:
    - if: unix
      then:
        - ${{ compiler("c") }}
        - ${{ stdlib("c") }}
      else:
        - ${{ compiler("m2w64_c") }}
        - ${{ stdlib("m2w64_c") }}
    - ${{ m2 }}bash >=5.2
    - ${{ m2 }}file
    - ${{ m2 }}gawk
    - ${{ m2 }}grep
    - ocaml-dune
    - if: unix
      then:
        - ${{ compiler("ocaml") }}
      else:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ ocaml_toolchain }}_*
    - if: build_platform != target_platform
      then:
        - ocaml ${{ ocaml_compiler_version }}.*
    - if: build_cppo_ocamlbuild
      then:
        - ocamlbuild >=0.16.1 *_1
    - if: not unix
      then:
        - ${{ m2 }}coreutils
  host:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ ocaml_toolchain }}_*
      else:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.*
  # cppo is a build-time tool, no runtime OCaml dependency needed
  ignore_run_exports:
    by_name:
      - ocaml
      - ocaml-cross-compilers

tests:
  # Package contents validation (strict)
  - package_contents:
      strict: true
      bin:
        - cppo
      files:
        - ${{ library }}doc/cppo/LICENSE.md
        - ${{ library }}doc/cppo/README.md
        - ${{ library }}lib/ocaml/cppo/*
        - etc/conda/test-files/*
        - if: build_cppo_ocamlbuild
          then:
            - ${{ library }}doc/cppo_ocamlbuild/LICENSE.md
            - ${{ library }}doc/cppo_ocamlbuild/README.md
            - ${{ library }}lib/ocaml/cppo_ocamlbuild/*

  # Python-based functional tests (skip arm64 - no emulator on conda-forge)
  - if: not arm64
    then:
      script: |
        python testing/test-cppo-arch.py
        python testing/test-cppo-functional.py
      files:
        recipe:
          - testing/test_utils.py
          - testing/test-cppo-arch.py
          - testing/test-cppo-functional.py
      requirements:
        run:
          - ${{ m2 }}file
          - python >=3.9

about:
  license: BSD-3-Clause
  license_file: LICENSE.md
  summary: C preprocessor for OCaml
  homepage: https://github.com/ocaml-community/cppo
  repository: https://github.com/ocaml-community/cppo

extra:
  recipe-maintainers:
    - MementoRC
